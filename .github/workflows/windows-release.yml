name: windows-release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Collect ThemeToggle package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/themetoggle.exe dist/ThemeToggle.exe
          Get-FileHash dist/ThemeToggle.exe -Algorithm SHA256 | Format-List
          Compress-Archive -Path dist/* -DestinationPath ThemeToggle-windows-x64.zip -Force
          Get-ChildItem ThemeToggle-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ThemeToggle-windows-x64
          path: |
            ThemeToggle-windows-x64.zip
            dist/ThemeToggle.exe
