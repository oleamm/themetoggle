name: windows-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Collect ThemeToggle package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/themetoggle.exe dist/ThemeToggle.exe
          Get-FileHash dist/ThemeToggle.exe -Algorithm SHA256 | Format-List
          Compress-Archive -Path dist/* -DestinationPath ThemeToggle-windows-x64.zip -Force
          Get-ChildItem ThemeToggle-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ThemeToggle-windows-x64
          path: |
            ThemeToggle-windows-x64.zip
            dist/ThemeToggle.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          @'
          One-click light/dark theme switcher for Windows.

          Download `ThemeToggle-windows-x64.zip`, unpack `ThemeToggle.exe` and run it.
          No installer, no admin rights, nothing to configure.

          - **Left click** the tray icon: light ⇄ dark
          - **Right click**: switch theme, start with Windows, quit
          - Keeps the taskbar, Start menu and every open app in sync at once
          '@ | Out-File -Encoding utf8 release-notes.md
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag ThemeToggle-windows-x64.zip --clobber
          } else {
            gh release create $tag ThemeToggle-windows-x64.zip --title "ThemeToggle $tag" --notes-file release-notes.md
          }
