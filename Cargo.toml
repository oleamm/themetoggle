[package]
name = "themetoggle"
version = "0.1.0"
edition = "2024"
description = "One-click Windows light/dark theme switcher that lives in the system tray"
build = "build.rs"

[build-dependencies]
winresource = "0.1.31"

[dependencies]
tray-icon = "0.24"
anyhow = "1"
png = "0.18"
log = "0.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
